<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>課堂提問牆：匿名提問＋文字雲</title>
<meta name="description" content="上課時學生用手機匿名提問、互相按讚，最多人想問的排最前面；也能出一題讓全班用一個詞回答，即時長成文字雲。學生不用 App、不用登入。">
<meta name="theme-color" content="#3B2A1E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cork:#C49A6C; --cork-d:#9B7148; --wood:#3B2A1E; --wood-2:#5A3F2B; --card:#FFFDF7; --ink:#2B2118; --sub:#6E5E4E; --line:#E3D6C3;
  --pin:#E23E3E; --pin-l:#FDE3E1; --mint:#1F8A70; --mint-l:#DDF3EA; --sun:#F4C430; --sun-l:#FFF4CC; --sky:#2F6DB5; --sky-l:#E1ECF8;
  --felt:#1F2B2A; --felt-2:#2A3836;
  --mq:0px; color-scheme:light;
}
html{font-size:17px;-webkit-text-size-adjust:100%}
html[data-fs="xl"]{font-size:21px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;font-weight:500;line-height:1.6;padding-top:var(--mq);
  background-color:var(--cork);
  background-image:radial-gradient(circle at 20% 30%,rgba(90,55,25,.28) 0 1.2px,transparent 1.6px),radial-gradient(circle at 70% 60%,rgba(255,235,200,.22) 0 1px,transparent 1.5px),radial-gradient(circle at 45% 85%,rgba(80,48,20,.22) 0 1.6px,transparent 2px),radial-gradient(circle at 85% 15%,rgba(255,240,210,.18) 0 1.3px,transparent 1.8px);
  background-size:13px 13px,17px 17px,23px 23px,29px 29px}
body.has-marquee{--mq:34px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sky);font-weight:700}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{line-height:1.3;margin:0;font-weight:900}

#marqueeBar{position:fixed;top:0;left:0;right:0;height:34px;background:var(--wood);z-index:60;overflow:hidden;display:none;align-items:center}
#marqueeBar.show{display:flex}
#marqueeTrack{display:inline-block;white-space:nowrap;padding-left:100%;font-size:15px;font-weight:700;color:#FFE7A3;animation:marquee-scroll 30s linear infinite}
#marqueeBar:hover #marqueeTrack{animation-play-state:paused}
@keyframes marquee-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#app{max-width:84rem;margin:0 auto;padding:.8rem 1rem calc(2rem + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;background:var(--wood);color:#FFF6E6;border-radius:.7rem;padding:.5rem .7rem;box-shadow:0 4px 0 #24190F}
.top h1{flex:1 1 14rem;font-size:1.4rem;display:flex;align-items:center;gap:.45rem;white-space:nowrap}
.top h1 small{font-size:.75rem;color:#E9CFA8;font-weight:700}
@media (max-width:560px){.top h1{font-size:1.15rem;flex-basis:100%}.top h1 small{display:none}}
.ibtn{min-height:2.5rem;padding:0 .75rem;border:0;border-radius:.55rem;background:var(--wood-2);color:#FFF6E6;font-weight:700;font-size:.88rem;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.ibtn:hover{background:#6C4C34}
.ibtn .dot{width:.6rem;height:.6rem;border-radius:50%;background:#AAA}
.ibtn .dot.on{background:#3DDC84;box-shadow:0 0 6px #3DDC84}.ibtn .dot.wait{background:var(--sun)}
.warn-line{margin:.45rem .2rem 0;font-size:.8rem;color:#3B2A1E;font-weight:700;text-shadow:0 1px 0 rgba(255,240,215,.5)}
.warn-line button{background:none;border:0;padding:0;color:#8B1A1A;font-weight:900;text-decoration:underline;font-size:inherit}

/* 便條卡（圖釘） */
.card{background:var(--card);border-radius:.3rem;box-shadow:0 1px 0 var(--line),0 8px 18px rgba(50,30,10,.28);padding:1rem 1.15rem;margin-top:1rem;position:relative}
.card.pin::before,.qc::before,.feat::before{content:'';position:absolute;top:-.45rem;left:50%;width:.95rem;height:.95rem;margin-left:-.475rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF8A80,var(--pin) 55%,#8E1B1B);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.card h2{font-size:1.3rem}
.card h3{font-size:1.05rem;margin-top:.8rem}
.lead{color:var(--sub);margin:.3rem 0 0}
.small{font-size:.84rem;color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:2.8rem;border:0;border-radius:.55rem;background:var(--wood);color:#FFF6E6;font-weight:900;padding:.3rem 1.1rem;text-decoration:none;text-align:center;box-shadow:0 3px 0 #1A110A}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1A110A}
.btn.red{background:var(--pin);color:#fff;box-shadow:0 3px 0 #8E1B1B}
.btn.green{background:var(--mint);color:#fff;box-shadow:0 3px 0 #0E4D3E}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 #A47F0A}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line),0 3px 0 var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.big{font-size:1.2rem;min-height:3.4rem;padding:.3rem 1.7rem}
.btn.sm{min-height:2.3rem;padding:.1rem .7rem;font-size:.85rem}
.btn.inuse{opacity:.4}
.go{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:.9rem;align-items:center}
.stack{display:grid;gap:.45rem;margin-top:.6rem}
.alert{border-radius:.5rem;padding:.5rem .8rem;margin-top:.7rem;font-weight:700;font-size:.92rem}
.alert.bad{background:var(--pin-l);color:#7A1414}.alert.ok{background:var(--mint-l);color:#0E4D3E}.alert.warn{background:var(--sun-l);color:#6B4F00}
.tag{display:inline-block;border-radius:1rem;padding:0 .5rem;font-size:.74rem;font-weight:900;background:#EFE6D8;color:var(--ink);margin-left:.2rem}
.tag.red{background:var(--pin-l);color:#7A1414}.tag.green{background:var(--mint-l);color:#0E4D3E}.tag.amber{background:var(--sun-l);color:#6B4F00}.tag.blue{background:var(--sky-l);color:#1C467A}

/* 首頁 */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.4rem;align-items:center;margin-top:1rem}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero .intro{background:var(--card);border-radius:.3rem;padding:1.2rem 1.3rem;box-shadow:0 8px 18px rgba(50,30,10,.28);transform:rotate(-.6deg)}
.hero .ttl{font-size:clamp(1.9rem,4.6vw,3rem);line-height:1.2}
.hero .ttl em{font-style:normal;background:linear-gradient(transparent 58%,var(--sun) 58%);padding:0 .1em}
.hero p{font-size:1.04rem}
.demo{position:relative;min-height:16rem}
.demo .dn{position:absolute;background:#FFF9C4;padding:.6rem .75rem 1.4rem;width:58%;font-weight:700;box-shadow:0 8px 14px rgba(50,30,10,.3);line-height:1.4}
.demo .dn b{position:absolute;right:.5rem;bottom:.25rem;font-size:.85rem;color:var(--pin)}
.demo .dn:nth-child(1){left:2%;top:4%;transform:rotate(-4deg)}
.demo .dn:nth-child(2){right:2%;top:18%;transform:rotate(3deg);background:#D7F5E9}
.demo .dn:nth-child(3){left:10%;top:52%;transform:rotate(2deg);background:#FFE0DC}
.demo .dn:nth-child(4){right:4%;top:66%;transform:rotate(-3deg);background:#DDEBFA;width:46%}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.1rem;margin-top:1.3rem}
.feat{background:var(--card);border-radius:.3rem;padding:1rem;box-shadow:0 6px 14px rgba(50,30,10,.25);position:relative}
.feat:nth-child(odd){transform:rotate(-.7deg)}.feat:nth-child(even){transform:rotate(.6deg)}
.feat .fi{font-size:2rem}
.feat h3{font-size:1.1rem;margin:.2rem 0}
.feat p{margin:0;font-size:.92rem;color:var(--sub)}
.steps{counter-reset:s;list-style:none;padding:0;margin:.5rem 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.6rem}
.steps li{counter-increment:s;background:#FBF4E8;border-radius:.4rem;padding:.6rem .7rem .6rem 2.6rem;position:relative;box-shadow:0 0 0 1px var(--line)}
.steps li::before{content:counter(s);position:absolute;left:.6rem;top:.55rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--pin);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:.85rem}

/* 教室清單 */
.clsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:.7rem;margin-top:.7rem}
.clscard{background:#FBF4E8;border-radius:.45rem;box-shadow:0 0 0 1px var(--line);padding:.7rem .85rem;border-top:4px solid var(--wood-2)}
.clscard.here{box-shadow:0 0 0 2px var(--pin);border-top-color:var(--pin)}
.clscard .cn{font-weight:900;font-size:1.25rem;line-height:1.3;overflow-wrap:anywhere}
.clscard .cm{color:var(--sub);font-size:.9rem;font-weight:700}
.clscard .cs{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.35rem}
.clscard .cs .tag{margin-left:0}
.clscard .go{margin-top:.5rem;gap:.35rem}
.roomline{margin-top:.5rem;background:var(--wood);color:#FFF6E6;border-radius:.45rem;padding:.35rem .7rem;font-weight:900;font-size:1.05rem;text-align:center;overflow-wrap:anywhere}
.lockbox{display:flex;gap:.7rem;align-items:flex-start;text-align:left;background:var(--sun-l);border-radius:.45rem;padding:.6rem .7rem;box-shadow:0 0 0 1.5px #E7C77A;margin-top:.6rem}
.lockbox .li{font-size:2rem;line-height:1}

/* 表單 */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.6rem 1rem;margin-top:.6rem}
.fld{display:block;font-weight:700;font-size:.92rem}
.fld input,.fld select,.fld textarea{display:block;width:100%;min-height:2.7rem;margin-top:.2rem;padding:.35rem .6rem;border:1.5px solid var(--line);border-radius:.45rem;background:#fff;font-weight:500}
.fld textarea{min-height:5rem;resize:vertical;line-height:1.5}
.fld small{display:block;color:var(--sub);font-weight:500;font-size:.78rem}
.seg{display:inline-flex;flex-wrap:wrap;border-radius:.5rem;box-shadow:0 0 0 1.5px var(--line);overflow:hidden;background:#fff}
.seg button{flex:1 1 auto;border:0;background:none;padding:.25rem .6rem;min-height:2.4rem;font-weight:700;font-size:.85rem;color:var(--sub);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--wood);color:#FFF6E6}
.presets{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.presets button{border:1.5px solid var(--line);background:#fff;border-radius:2rem;padding:.2rem .75rem;font-weight:700;min-height:2.3rem;font-size:.88rem}
.presets button:hover{border-color:var(--wood-2)}
.presets button[aria-pressed="true"]{border-color:var(--pin);background:var(--pin-l);color:#7A1414}

/* 老師：主持台 */
.modes{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.modes button{border:0;border-radius:.6rem .6rem 0 0;padding:.55rem 1.2rem;font-weight:900;font-size:1.05rem;background:rgba(59,42,30,.55);color:#FFF1DC;min-height:3rem}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 -2px 0 var(--pin) inset}
.modes .live{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:#3DDC84;margin-left:.35rem;box-shadow:0 0 6px #3DDC84;vertical-align:middle}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 18.5rem;gap:1rem;align-items:start}
@media (max-width:960px){.desk{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:0 .4rem .4rem .4rem;box-shadow:0 8px 18px rgba(50,30,10,.28);padding:.9rem 1rem 1.1rem}
.ctlbar{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center}
.ctlbar .grp{display:flex;align-items:center;gap:.35rem;font-size:.85rem;font-weight:700;color:var(--sub)}
.bigstate{font-size:1.5rem;text-align:center;margin:.6rem 0;line-height:1.4;font-weight:900}
.status{display:inline-flex;align-items:center;gap:.4rem;font-weight:900;border-radius:2rem;padding:.2rem .85rem;font-size:.95rem}
.status.on{background:var(--mint-l);color:#0E4D3E}.status.off{background:#EFE6D8;color:var(--sub)}
.status.on::before{content:'';width:.6rem;height:.6rem;border-radius:50%;background:#1FBF6B;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.ftabs{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.9rem;align-items:center}
.ftabs button{border:1.5px solid var(--line);background:#fff;border-radius:2rem;padding:.15rem .8rem;font-weight:700;min-height:2.3rem;font-size:.88rem}
.ftabs button[aria-pressed="true"]{background:var(--wood);border-color:var(--wood);color:#FFF6E6}
.ftabs button b{margin-left:.25rem}
.ftabs .sp{flex:1 1 auto}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:1.1rem .9rem;margin-top:1rem}
.qc{position:relative;background:#FFF9C4;border-radius:.15rem;padding:.75rem .8rem .6rem;box-shadow:0 7px 12px rgba(50,30,10,.22);display:flex;flex-direction:column;gap:.35rem;min-height:8rem}
.qc.c1{background:#D7F5E9}.qc.c2{background:#FFE0DC}.qc.c3{background:#DDEBFA}.qc.c4{background:#F1E4FF}
.qc.pending{background:repeating-linear-gradient(-45deg,#FFFDF2,#FFFDF2 8px,#F6EFD9 8px,#F6EFD9 16px);outline:2px dashed #C9A85A}
.qc.done{opacity:.7;filter:saturate(.4)}
.qc.hidden{opacity:.5;filter:grayscale(1)}
.qc.spot{outline:4px solid var(--pin);outline-offset:3px}
.qc .qt{font-weight:900;font-size:1.12rem;line-height:1.45;overflow-wrap:anywhere;flex:1 1 auto}
.qc .qm{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--sub);font-weight:700;flex-wrap:wrap}
.qc .likes{margin-left:auto;font-size:1.25rem;font-weight:900;color:var(--pin);white-space:nowrap}
.qc .qa{display:flex;flex-wrap:wrap;gap:.25rem;border-top:1px dashed rgba(0,0,0,.15);padding-top:.35rem}
.qc .qa button{border:0;background:rgba(255,255,255,.65);border-radius:.4rem;min-height:2.1rem;padding:0 .5rem;font-weight:700;font-size:.8rem}
.qc .qa button:hover{background:#fff}
.qc .qa button.main{background:var(--wood);color:#FFF6E6}
.empty{text-align:center;color:var(--sub);padding:1.6rem .5rem;font-weight:700}
.spotbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem 1rem;align-items:center;background:var(--wood);color:#FFF6E6;border-radius:.5rem;padding:.8rem 1rem;margin-top:.9rem}
.spotbar .sl{font-size:.8rem;color:#E9CFA8;font-weight:900}
.spotbar .st{font-size:1.35rem;font-weight:900;line-height:1.4;overflow-wrap:anywhere}
.spotbar .go{margin-top:0}
@media (max-width:640px){.spotbar{grid-template-columns:1fr}}
.side .card{margin-top:0;margin-bottom:1rem}
.roomcard{text-align:center}
.roomcard .code{font-size:2.1rem;letter-spacing:.14em;color:var(--pin);font-weight:900;line-height:1.2}
.qr{display:flex;justify-content:center;margin:.4rem auto;background:#fff;padding:.5rem;border-radius:.4rem;width:max-content;max-width:100%;box-shadow:0 0 0 1px var(--line)}
.qr img,.qr canvas{display:block;max-width:100%;height:auto}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;margin-top:.5rem}
.kpis div{background:#FBF4E8;border-radius:.4rem;padding:.35rem;text-align:center;font-size:.75rem;color:var(--sub);font-weight:700}
.kpis b{display:block;font-size:1.4rem;color:var(--ink);line-height:1.2}

/* 文字雲 */
.cloudbox{background:var(--felt);border-radius:.5rem;margin-top:.9rem;position:relative;overflow:hidden;box-shadow:inset 0 0 0 6px var(--wood-2),inset 0 0 40px rgba(0,0,0,.5);
  background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.2px);background-size:6px 6px}
.cloudbox canvas{display:block;width:100%;height:auto;cursor:pointer}
.cloudbox .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9FB3AE;font-weight:900;font-size:1.2rem;text-align:center;padding:1rem;pointer-events:none}
.prompt{font-size:1.45rem;font-weight:900;line-height:1.35;overflow-wrap:anywhere}
.wlist{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem}
.wlist button{border:1.5px solid var(--line);background:#fff;border-radius:2rem;padding:.1rem .7rem;font-weight:700;font-size:.88rem;min-height:2.2rem}
.wlist button b{color:var(--pin);margin-left:.25rem}
.wlist button.off{opacity:.5;text-decoration:line-through}
.rounds{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.rounds button{border:1.5px solid var(--line);background:#fff;border-radius:.4rem;padding:.1rem .6rem;font-weight:700;font-size:.82rem;min-height:2.1rem;max-width:16rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rounds button[aria-pressed="true"]{background:var(--felt);color:#fff;border-color:var(--felt)}
.inrow{display:flex;gap:.45rem;margin-top:.5rem}
.inrow input{flex:1 1 auto;min-width:0;min-height:2.9rem;border:1.5px solid var(--line);border-radius:.5rem;padding:0 .7rem;font-weight:700;background:#fff}
.inrow .btn{flex:none;white-space:nowrap}

/* 投影畫面 */
body.proj{overflow:hidden}
.projv{position:fixed;inset:0;top:var(--mq);z-index:50;display:flex;flex-direction:column;padding:1.2rem 1.5rem;gap:1rem}
.projv .ph1{display:flex;align-items:center;gap:1rem;background:var(--wood);color:#FFF6E6;border-radius:.7rem;padding:.6rem 1rem;box-shadow:0 4px 0 #24190F}
.projv .ph1 h1{flex:1 1 auto;font-size:clamp(1.3rem,2.6vw,2.2rem);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projv .ph1 .jc{text-align:right;font-weight:700;font-size:.9rem;line-height:1.2;color:#E9CFA8}
.projv .ph1 .jc b{display:block;font-size:clamp(1.6rem,3vw,2.6rem);letter-spacing:.14em;color:var(--sun)}
.projv .pqr{background:#fff;padding:.3rem;border-radius:.3rem;line-height:0}
.projv .pqr img,.projv .pqr canvas{width:6.5rem;height:6.5rem}
.projv .pbody{flex:1 1 auto;min-height:0;overflow:hidden;position:relative}
.projv .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(20rem,1fr));gap:1.4rem 1.2rem;padding:.6rem .2rem}
.projv .qc .qt{font-size:clamp(1.2rem,2vw,1.7rem)}
.projv .qc .likes{font-size:1.7rem}
.projv .bigq{height:100%;display:flex;align-items:center;justify-content:center}
.projv .bigq .qc{width:min(64rem,96%);min-height:0;padding:2rem 2.4rem 1.6rem;transform:rotate(-1deg)}
.projv .bigq .qc .qt{font-size:clamp(2rem,4.6vw,4rem);line-height:1.35}
.projv .bigq .lab{position:absolute;top:.4rem;left:50%;transform:translateX(-50%);background:var(--pin);color:#fff;font-weight:900;border-radius:2rem;padding:.2rem 1.2rem;font-size:1.2rem;z-index:2}
.projv .pcloud{height:100%;display:flex;flex-direction:column;gap:.6rem}
.projv .pcloud .prompt{color:#FFF6E6;background:var(--wood);border-radius:.6rem;padding:.5rem 1rem;font-size:clamp(1.4rem,3vw,2.6rem);text-align:center}
.projv .pcloud .cloudbox{flex:1 1 auto;margin:0;display:flex;align-items:center;justify-content:center}
.projv .pcloud .cloudbox canvas{width:auto;height:auto;max-width:100%;max-height:100%}
.projv .exit{position:fixed;right:.6rem;bottom:.6rem;z-index:55;opacity:.35}
.projv .exit:hover{opacity:1}
.projv .pfoot{font-weight:900;color:#3B2A1E;text-align:center;font-size:1rem}

/* 學生手機 */
.stu{max-width:32rem;margin:0 auto}
.stu .top h1{flex:1 1 auto;flex-basis:auto;font-size:1.15rem;min-width:0}
.stu .top{flex-wrap:nowrap}
.amtin{display:flex;gap:.4rem;margin-top:.6rem}
.amtin .btn{white-space:nowrap;flex:none}
.amtin input{flex:1 1 auto;min-width:0;min-height:3.2rem;border:2px solid var(--line);border-radius:.5rem;padding:0 .7rem;font-size:1.2rem;font-weight:900}
.askbox textarea{display:block;width:100%;min-height:6.5rem;border:2px solid var(--line);border-radius:.5rem;padding:.55rem .7rem;font-size:1.1rem;font-weight:700;resize:vertical;background:#fff;line-height:1.5}
.askbox .cnt{display:flex;justify-content:space-between;font-size:.8rem;color:var(--sub);font-weight:700;margin-top:.2rem}
.askbox .btn{width:100%;min-height:3.4rem;font-size:1.2rem;margin-top:.5rem}
.sq{display:flex;gap:.6rem;align-items:flex-start;background:#FFF9C4;border-radius:.2rem;padding:.6rem .65rem;box-shadow:0 4px 8px rgba(50,30,10,.18);margin-top:.7rem}
.sq.mine{background:#D7F5E9}
.sq.done{opacity:.6}
.sq .t{flex:1 1 auto;font-weight:900;line-height:1.45;overflow-wrap:anywhere;min-width:0}
.sq .t small{display:block;font-weight:700;color:var(--sub);font-size:.75rem}
.likebtn{flex:none;border:2px solid var(--line);background:#fff;border-radius:.6rem;min-width:3.4rem;min-height:3.2rem;font-weight:900;font-size:1.05rem;line-height:1.1}
.likebtn small{display:block;font-size:.7rem;color:var(--sub)}
.likebtn[aria-pressed="true"]{background:var(--pin);border-color:var(--pin);color:#fff}
.likebtn[aria-pressed="true"] small{color:#FFE3E1}
.likebtn[disabled]{opacity:.45}
.myw{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem}
.myw span{background:var(--felt);color:#FFD166;border-radius:2rem;padding:.15rem .8rem;font-weight:900}
.spotmini{background:var(--wood);color:#FFF6E6;border-radius:.5rem;padding:.6rem .8rem;margin-top:.7rem;font-weight:900;line-height:1.45}
.spotmini small{display:block;color:#E9CFA8;font-size:.78rem}
.stu .foot{color:#3B2A1E}

.foot{text-align:center;font-size:.82rem;color:#3B2A1E;margin-top:2rem;font-weight:700;background:rgba(255,248,235,.75);border-radius:.6rem;padding:.7rem}
.foot a{margin:0 .4rem;color:#7A3E10}
#modal{position:fixed;inset:0;background:rgba(30,18,8,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:1rem}
#modal.show{display:flex}
#modalBox{background:var(--card);width:100%;max-width:40rem;max-height:calc(100dvh - 2rem);overflow:auto;border-radius:.5rem;padding:1rem 1.1rem;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#modalBox.wide{max-width:60rem}
#modalBox h2{font-size:1.3rem;margin-bottom:.4rem}
#modalBox ul,#modalBox ol{margin:.3rem 0;padding-left:1.2em}
#modalBox .top{background:none;color:var(--ink);box-shadow:none;padding:0}
#modalBox .top .ibtn{background:#EFE6D8;color:var(--ink)}
.set-sec{border-radius:.45rem;margin-bottom:.45rem;background:#FBF4E8;box-shadow:0 0 0 1px var(--line)}
.set-sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;font-weight:700;min-height:2.9rem}
.set-sec>summary::-webkit-details-marker{display:none}
.set-sec>summary::after{content:'▸';flex:none;transition:transform .2s}
.set-sec[open]>summary::after{transform:rotate(90deg)}
.set-sec .sst{flex:1 1 0;min-width:0}
.set-sec .ssv{font-weight:500;font-size:.78rem;color:var(--sub);text-align:right}
.set-body{padding:0 .75rem .75rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--wood);color:#FFF6E6;padding:.55rem 1rem;border-radius:.6rem;z-index:90;font-weight:700;max-width:calc(100vw - 2rem)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;min-width:30rem}
table.t th,table.t td{padding:.35rem .45rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{background:#FBF4E8;font-size:.8rem}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#printArea{display:none}
#printWm{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#marqueeTrack{animation:marquee-scroll 90s linear infinite!important}}
@media print{
  @page{size:A4;margin:12mm}
  html{font-size:12px}
  body{background:#fff;padding:0}
  #marqueeBar,.noprint,.toast,#modal,.top,.warn-line,.foot{display:none!important}
  #app{max-width:none;padding:0}
  body.print-area #app{display:none!important}
  body.print-area #printArea{display:block!important}
  .psheet{break-after:page;page-break-after:always}
  .psheet:last-child{break-after:auto;page-break-after:auto}
  #printWm{display:flex!important;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;pointer-events:none}
  #printWm img{width:42%;max-width:380px;opacity:.11}
}
.psheet{font-size:12px;color:#000}
.psheet h1{font-size:20px;margin:0 0 2px}
.psheet h2{font-size:15px;margin:12px 0 4px}
.psheet .meta{font-size:11px;color:#444;margin-bottom:8px}
.psheet table{width:100%;border-collapse:collapse;margin-top:6px}
.psheet th,.psheet td{border:1px solid #777;padding:4px 6px;text-align:left;vertical-align:top}
.psheet th{background:#F1EBDF;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.psheet td.c{text-align:center;white-space:nowrap}
.psheet img.cl{display:block;width:100%;max-height:330px;object-fit:contain;margin-top:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
</head>
<body>
<div id="marqueeBar"><div id="marqueeTrack"></div></div>
<main id="app"></main>
<div id="printArea"></div>
<div id="modal" role="dialog" aria-modal="true"><div id="modalBox"></div></div>
<noscript>這個工具需要開啟 JavaScript 才能使用。</noscript>
<script src="data.js"></script>
<script src="watermark.js"></script>
<script src="app.js"></script>
</body>
</html>
